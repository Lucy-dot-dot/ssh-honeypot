[package]
name = "ssh-honeypot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Lucy-dot-dot/ssh-honeypot.git"
license = "MIT"
readme = "README.md"

[[bin]]
name = "ssh-honeypot"
path = "src/main.rs"

[[bin]]
name = "report-generator"
path = "src/bin/report_generator.rs"

[workspace]
members = ["desktop", "common", "shell"]

[dependencies]
common = { path = "common" }
shell = { path = "shell" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
russh = "0.62.6"
log = "0.4.33"
env_logger = "0.11.11"
async-trait = "0.1.92"
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
clap = { version =  "4.6.6", features = ["derive", "env", "usage", "suggestions", "color"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
directories = "6.0.0"
rand = "0.10.2"
russh-sftp = "2.4.0"
hex = "0.4.3"
sha2 = "0.11.0"
infer = "0.22.0"
reqwest = { version = "0.13.4", features = ["brotli", "deflate", "json", "query"] }
webpki-root-certs = "1.0.9"
serde_json = "1.0.151"
ssh-encoding = "0.3.0-rc.9"

[profile.release]
lto = true
strip = true
