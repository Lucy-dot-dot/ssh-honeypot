[package]
name = "ssh-honeypot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Lucy-dot-dot/ssh-honeypot.git"
license = "MIT"
readme = "README.md"

[[bin]]
name = "ssh-honeypot"
path = "src/main.rs"

[[bin]]
name = "report-generator"
path = "src/bin/report_generator.rs"

[workspace]
members = ["desktop", "common", "shell"]

[workspace.dependencies]
common = { path = "common" }
shell = { path = "shell" }
tokio = "1.53.1"
async-trait = "0.1.92"
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.33"
toml = "1.1.4"
directories = "6.0.0"
rand = "0.10.2"
hex = "0.4.3"
sha2 = "0.11.0"
reqwest = "0.13.4"

[dependencies]
common = { workspace = true }
shell = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
russh = "0.63.1"
log = { workspace = true }
env_logger = "0.11.11"
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true, features = ["env", "usage", "suggestions", "color"] }
serde = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
russh-sftp = "2.4.0"
hex = { workspace = true }
sha2 = { workspace = true }
infer = "0.22.0"
reqwest = { workspace = true, features = ["brotli", "deflate", "json", "query"] }
webpki-root-certs = "1.0.9"
serde_json = { workspace = true }
ssh-encoding = "0.3.0-rc.9"

[profile.release]
lto = true
strip = true
