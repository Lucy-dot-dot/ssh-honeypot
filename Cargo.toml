[package]
name = "ssh-honeypot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Lucy-dot-dot/ssh-honeypot.git"
license = "MIT"
readme = "README.md"

[[bin]]
name = "ssh-honeypot"
path = "src/main.rs"

[[bin]]
name = "report-generator"
path = "src/bin/report_generator.rs"

[workspace]
members = ["desktop", "common", "shell", "mysql", "mssql", "postgres"]

[workspace.dependencies]
common = { path = "common" }
mysql-honeypot = { path = "mysql" }
mssql-honeypot = { path = "mssql" }
postgres-honeypot = { path = "postgres" }
shell = { path = "shell" }
tokio = "1.54.1"
async-trait = "0.1.92"
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
toml = "1.1.8"
directories = "6.0.0"
rand = "0.10.3"
hex = "0.4.3"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
reqwest = "0.13.5"

[dependencies]
common = { workspace = true }
shell = { workspace = true }
mysql-honeypot = { workspace = true }
mssql-honeypot = { workspace = true }
postgres-honeypot = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
russh = "0.65.0"
log = { workspace = true }
env_logger = "0.11.11"
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true, features = ["env", "usage", "suggestions", "color"] }
serde = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
russh-sftp = "3.0.1"
hex = { workspace = true }
sha2 = { workspace = true }
infer = "0.22.0"
reqwest = { workspace = true, features = ["brotli", "deflate", "json", "query"] }
webpki-root-certs = "1.0.9"
serde_json = { workspace = true }
ssh-encoding = "0.3.0-rc.9"
uuid = { workspace = true }

[profile.release]
lto = true
strip = true

# Optimize dependencies in debug builds. Crypto code (rsa keygen, russh, sqlx)
# is unusably slow otherwise while our own crates still compile fast.
[profile.dev.package."*"]
opt-level = 3
