services:
  postgres:
    image: postgres:16-alpine
    container_name: ssh-honeypot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssh_honeypot
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: honeypot
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Standard way to expose the port on everything
      # - "5432:5432"
      # Very verbose way to expose the port on localhost
      - protocol: tcp
        mode: host
        host_ip: 127.0.0.1
        name: postgres-ipv4
        published: 5432
        target: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U honeypot -d ssh_honeypot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  ssh-honeypot:
    image: ghcr.io/lucy-dot-dot/ssh-honeypot:master
    environment:
      DISABLE_CLI_INTERFACE: true
      DATABASE_URL: postgresql://honeypot:honeypot@postgres:5432/ssh_honeypot
    volumes:
      - source: ./config.toml
        target: /config.toml
        type: bind
      - source: keys
        target: /keys
        type: volume
    ports:
      - "2222:2222"
      - "22:22"
      - "3306:3306"
      - "1433:1433"
      # PostgreSQL module. The default host port 5432 is already used by the
      # postgres db service above (bound to 127.0.0.1 only) — publish the
      # module on a different host port, or remove the db service mapping.
      # - "5432:5432"
      # Metrics endpoint (requires [metrics] enabled = true or --enable-metrics in config.toml)
      # - "127.0.0.1:9154:9154"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Optional Prometheus + Grafana stack for the metrics endpoint.
  # 1. Enable the metrics endpoint (config.toml [metrics] enabled = true or --enable-metrics)
  # 2. Copy prometheus.yml.example to prometheus.yml
  # 3. Uncomment this block and the "127.0.0.1:9154:9154" port above
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: ssh-honeypot-prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - source: ./prometheus.yml
  #       target: /etc/prometheus/prometheus.yml
  #       type: bind
  #   ports:
  #     - "127.0.0.1:9090:9090"
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: ssh-honeypot-grafana
  #   restart: unless-stopped
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   ports:
  #     - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  keys:
  # grafana_data:

# Uncomment this block AND update /etc/docker/daemon.json on the host to enable
# IPv6 inside the container (see README for daemon.json content).
